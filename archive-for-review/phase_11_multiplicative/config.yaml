# v10.1_algebraic_index.yaml - Production Algebraic Consistency
#
# Primary Objective: Maximize z(a) + z(b) ≈ z(a ⊕ b) homomorphism.
# Valuation: Index-based (v3(n)) for algebraic naturalness.

# =============================================================================
# Device Configuration
# =============================================================================
device:
  cuda_device: 0
  use_amp: false

# =============================================================================
# Model Architecture
# =============================================================================
model:
  name: TernaryVAEV6Controllable
  latent_dim: 64
  hidden_dim: 128
  max_radius: 0.99
  curvature: 1.0
  learnable_curvature: true

  factored: true
  radial_dims: 8    # Increased from 4 to give more "range" for addition results

  positional_encoding: true

  projection_layers: 2
  projection_dropout: 0.1
  init_identity: true
  tangent_scale: 0.1

  encoder_type: improved
  decoder_type: improved

# =============================================================================
# Differential Learning Rates
# =============================================================================
option_c:
  enabled: true
  encoder_a_lr_scale: 0.2
  encoder_b_lr_scale: 0.1
  projections_lr_scale: 1.0

# =============================================================================
# StateNet Controller
# =============================================================================
statenet:
  enabled: true
  initial:
    encoder_a_trainable: true
    encoder_b_trainable: true
    projections_trainable: true

  coverage:
    fix_threshold: 0.35
    train_threshold: 0.45
  hierarchy:
    plateau_patience: 15
  timing:
    warmup_epochs: 100

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  rich_hierarchy:
    enabled: true
    hierarchy_weight: 4.0
    coverage_weight: 5.0        # High weight to ensure decoder can resolve sums
    separation_weight: 5.0
    variance_weight: 2.0
    inner_radius: 0.08
    outer_radius: 0.85

  radial:
    enabled: true
    weight: 2.0                 # Tighten radii to support better addition results
    margin_weight: 1.0

  geodesic:
    enabled: true
    phase_start_epoch: 10
    curvature: 1.0
    weight: 3.0                 # Critical for directional alignment
    use_individual_valuation: true

  rank:
    enabled: true
    weight: 1.0
    temperature: 0.1
    scatter_weight: 0.5

  monotonic:
    enabled: true
    weight: 1.0

  hyperbolic_kl:
    enabled: true
    beta: 0.1
    weight: 0.01

  angular_coherence:
    enabled: true
    weight: 2.0
    phase_start_epoch: 15
    level_prefix_k: [5, 4, 3, 2, 2, 1, 0, 0, 0, 0]
    target_sim: [1.0, 0.95, 0.90, 0.85, 0.80, 0.70, 0.0, 0.0, 0.0, 0.0]

  algebraic_coherence:
    enabled: true
    weight: 2.0
    target_sim: 0.80
    phase_start_epoch: 20

  algebraic_addition:
    enabled: true
    weight: 10.0                # Primary Phase 10 driver
    n_pairs: 1024
    phase_start_epoch: 30       # Allow space to organize before forcing algebra

  algebraic_multiplication:
    enabled: true
    weight: 10.0                # Primary Phase 11 driver
    n_pairs: 1024
    phase_start_epoch: 50       # Phase in after addition starts to align

  lagrangian:
    enabled: true
    lr: 0.1
    max_lambda: 5.0

# =============================================================================
# Training Configuration
# =============================================================================
training:
  epochs: 100
  batch_size: 4096
  lr: 1.0e-3
  weight_decay: 1.0e-4

  scheduler:
    type: cosine_warmup_restart
    T_0: 100
    T_mult: 2

  eval_every: 10
  save_every: 25

# =============================================================================
# Data Configuration
# =============================================================================
data:
  valuation_type: index

# =============================================================================
# Version Tracking
# =============================================================================
version:
  model: "11.0"
  config: "v11_multiplicative"
  changes:
    - "V11.0: Multiplicative Consistency"
    - "Switch to Index valuation for algebraic naturalness"
    - "Aggressive AlgebraicAddition weight (10.0)"
    - "Increased radial_dims (8) for result space"
