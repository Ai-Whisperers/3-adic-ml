# research_extended_grokking.yaml (previously: v5_12_4_extended_grokking.yaml)
# V5.12.4 Extended Configuration: Grokking Detection and Extended Training
#
# This config is optimized for:
# 1. Extended training runs (500 epochs) to observe emergent phenomena
# 2. Enhanced grokking detection and monitoring
# 3. Multi-phase learning rate strategy
# 4. Detailed logging for emergence analysis
#
# Expected runtime: 4-8 hours on RTX 4090, 8-16 hours on RTX 2060 SUPER
# Target: Observe grokking patterns, phase transitions, emergent behaviors

# Device Configuration
device:
  name: "v5_12_4_extended_grokking"  # Metadata only
  cuda_device: 0       # CUDA device index (used by train.py)
  use_amp: false       # Automatic mixed precision (used by train.py)

# Model Architecture (V6.0 with true hyperbolic geometry)
model:
  name: TernaryVAEV6Controllable
  latent_dim: 16
  hidden_dim: 64
  max_radius: 0.95
  curvature: 1.0
  learnable_curvature: true
  factored: false  # Legacy preset: keep non-factored latent when schema defaults change
  projection_layers: 2
  projection_dropout: 0.1
  encoder_type: improved   # "improved" (SiLU+LayerNorm) or "standard" (ReLU)
  decoder_type: improved

# Option C: Partial Freeze (optimized for long training)
option_c:
  enabled: true
  encoder_b_lr_scale: 0.1
  encoder_a_lr_scale: 0.05

# Anchor Checkpoint (pre-trained weights to start from for coverage preservation)
anchor_checkpoint:
  path: models/checkpoints/v5_12/v5_12_4/best_Q.pt  # Use compatible V5.12.4 checkpoint
  encoder_to_load: both  # Load both encoders for coverage preservation
  decoder_to_load: decoder_A  # Load decoder for reconstruction

# StateNet Control (Enhanced for extended training)
statenet:
  enabled: true
  coverage:
    fix_threshold: 0.995       # Fix encoder when coverage drops below
    train_threshold: 1.0       # Allow training when coverage above
    floor: 0.95
  hierarchy:
    plateau_threshold: 0.0005  # More sensitive plateau detection
    plateau_patience: 10
    patience_ceiling: 25
  controller:
    grad_threshold: 0.005      # More sensitive gradient monitoring
    grad_patience: 5
  timing:
    warmup_epochs: 10          # Longer warmup for stability
    hysteresis_epochs: 5       # More conservative state changes

# NOTE: Progressive unfreezing replaced by StateNet trainability control
# StateNet dynamically controls encoder_a/encoder_b/controller trainability

# Loss Configuration (Balanced for grokking observation)
loss:
  # PRIMARY: RichHierarchyLoss
  rich_hierarchy:
    enabled: true
    hierarchy_weight: 5.0
    coverage_weight: 1.0
    richness_weight: 2.5  # Slightly higher for complexity
    separation_weight: 3.0
    min_richness_ratio: 0.4  # Allow more exploration

  # AUXILIARY: Radial targets
  radial:
    enabled: true
    # Note: inner_radius/outer_radius are shared with rich_hierarchy
    inner_radius: 0.08
    outer_radius: 0.90
    radial_weight: 1.0
    margin_weight: 0.5
  # Phase 2: Geodesic (earlier start for extended training)
  geodesic:
    enabled: true
    phase_start_epoch: 50  # Later start for extended runs
    curvature: 1.0
    max_target_distance: 3.0
    n_pairs: 2000
    use_smooth_l1: true
    weight: 0.4  # Slightly higher for geometric refinement

  # Global rank loss
  rank:
    enabled: true
    weight: 0.5
    temperature: 0.1
    n_pairs: 2000

  # Zero-structure loss
  zero_structure:
    enabled: true
    valuation_weight: 0.5
    sparsity_weight: 0.3

# Riemannian Optimization
riemannian:
  enabled: true
  optimizer: adam
  stabilize: 10  # Re-project manifold parameters every N steps (for learnable curvature)

# Extended Training Configuration
training:
  epochs: 100  # Reduced for from-scratch training while allowing grokking observation
  batch_size: 512
  lr: 8.0e-4  # Slightly lower for extended training
  weight_decay: 1.0e-4
  max_grad_norm: 1.0

  use_stratified: true
  high_v_budget_ratio: 0.25

  # Extended adaptive curriculum
  use_adaptive: true
  hierarchy_threshold: -0.75
  patience: 50  # Much longer patience for grokking
  min_epochs: 100  # Longer minimum training

  # Multi-phase learning rate strategy
  scheduler:
    type: multi_phase_cosine
    phases:
      - name: exploration
        epoch_range: [0, 150]
        base_lr_scale: 1.0
        annealing: cosine
        T_0: 25
        T_mult: 2
      - name: grokking_search
        epoch_range: [150, 350]
        base_lr_scale: 0.3
        annealing: constant
      - name: fine_tuning
        epoch_range: [350, 500]
        base_lr_scale: 0.1
        annealing: linear_decay

  # Enhanced evaluation for grokking detection
  eval_every: 2
  save_every: 25
  print_every: 2

  # Grokking detection parameters
  grokking_detection:
    enabled: true
    monitor_window: 20  # Window for trend analysis
    plateau_threshold: 0.0001  # Loss change threshold for plateau
    plateau_patience: 15  # Epochs to confirm plateau
    accuracy_jump_threshold: 0.02  # Minimum jump to detect grokking
    gradient_norm_track: true
    representation_analysis: true

# Logging Configuration
logging:
  enhanced_metrics:
    enabled: true  # Enable batch-level TensorBoard logging
  histogram_every: 10   # Log weight histograms every N epochs
  embedding_every: 50   # Log embeddings every N epochs

# =============================================================================
# METADATA (for documentation, not used by train.py)
# =============================================================================

# Success Criteria (reference targets for evaluation)
targets:
  coverage: 1.0
  hierarchy_B: -0.83
  Q_target: 2.2

# Version tracking
version:
  model: "6.0"
  config: "5.12.4"
  date: "2026-01-24"
