# v7.yaml - P-Adic VAE V7.0 Configuration
# Factored Latent Architecture: z_radial ⊕ z_identity
#
# V7.0 Key Change from V6:
#   Factored latent space eliminates hierarchy/reconstruction gradient conflict.
#   - z_r (first 4 dims)  → r = sigmoid(linear_r(z_r)) * max_radius
#   - z_θ (remaining 28)  → dir = normalize(tangent_net(z_θ))
#   - z_hyp = r * dir  (Poincaré ball point by construction)
#
#   Gradient isolation (proven):
#     d(||z_hyp||)/d(z_θ) = 0 because F.normalize's Jacobian (I - dir*dirᵀ)/||z_θ||
#     projects r*dir onto the tangent sphere, which is orthogonal to dir.
#
#   Expected outcome: hierarchy → ~0.95, dist_corr → ~0.94, Q → ~2.37
#
# V6 ceiling confirmed at Q=2.163 (hier=0.839) — see docs/audits/22-03-2026-Q-CEILING-ANALYSIS.md

# =============================================================================
# Device Configuration
# =============================================================================
device:
  name: "v7_factored"
  cuda_device: 0
  use_amp: false
  pin_memory: true
  num_workers: 4
  empty_cache_freq: 25

# =============================================================================
# Model Architecture (V7.0 Factored Latent)
# =============================================================================
model:
  name: TernaryVAEV6Controllable
  latent_dim: 32
  hidden_dim: 64
  max_radius: 0.95
  curvature: 1.0
  learnable_curvature: true

  # V7 factored latent: split z_tangent into z_r (radial) and z_θ (direction)
  factored: true
  radial_dims: 4          # k=4: enough for 10 valuation levels, small enough to not dominate

  # Projection network (operates on z_θ only in factored mode)
  projection_layers: 2
  projection_dropout: 0.1
  init_identity: true
  tangent_scale: 0.1

  encoder_type: improved
  decoder_type: improved

# =============================================================================
# Riemannian Optimization
# =============================================================================
riemannian:
  enabled: true
  optimizer: adam
  stabilize: 10

# =============================================================================
# Precision Settings
# =============================================================================
precision:
  dtype: float64

# =============================================================================
# Differential Learning Rates
# =============================================================================
option_c:
  enabled: true
  encoder_a_lr_scale: 0.2
  encoder_b_lr_scale: 0.1
  projections_lr_scale: 1.0

# =============================================================================
# Anchor Checkpoint — train from scratch (V6 projection weights incompatible)
# Encoder weights could be loaded but projection dims changed (32→28 direction).
# =============================================================================
# anchor_checkpoint:
#   path: "runs/v6_20260321_210840/checkpoints/best_Q.pt"
#   encoder_to_load: both
#   decoder_to_load: decoder_A

# =============================================================================
# StateNet Controller
# =============================================================================
statenet:
  enabled: true

  initial:
    encoder_a_trainable: true
    encoder_b_trainable: true
    projections_trainable: true

  coverage:
    fix_threshold: 0.35
    train_threshold: 0.45
    floor: 0.3
  hierarchy:
    plateau_threshold: 0.0005
    plateau_patience: 10
    patience_ceiling: 25

  controller:
    grad_threshold: 0.001
    grad_patience: 20
    patience_ceiling: 40

  timing:
    warmup_epochs: 10
    hysteresis_epochs: 5

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  rich_hierarchy:
    enabled: true
    hierarchy_weight: 5.0
    coverage_weight: 1.0
    separation_weight: 3.0
    variance_weight: 0.5
    inner_radius: 0.08
    outer_radius: 0.85

  radial:
    enabled: true
    weight: 1.5
    margin_weight: 0.5

  geodesic:
    enabled: true
    phase_start_epoch: 10
    curvature: 1.0
    max_target_distance: 3.0
    n_pairs: 2000
    use_smooth_l1: true
    weight: 2.0
    use_individual_valuation: false

  rank:
    enabled: true
    weight: 0.5
    temperature: 0.1
    n_pairs: 2000
    scatter_weight: 0.3  # V7: scatter near-zero by construction (was 0.8, reduced per Item F diagnostic)

  monotonic:
    enabled: true
    weight: 1.0
    target_loss_weight: 0.5
    min_margin: 0.02

  hyperbolic_kl:
    enabled: true
    beta: 0.1
    weight: 0.01
    free_bits: 0.5
    variance_only: false  # V7: ValuationPriorLoss is disabled, so re-enable ||mu||² term
                          # to prevent mu[:, 4:] (z_θ) drifting unboundedly.
                          # KL weight=0.01 vs hierarchy weight=5.0 → hierarchy wins.

  within_level_contrastive:
    enabled: false
    weight: 0.5
    max_pairs_per_level: 500

  angular_coherence:
    enabled: true
    weight: 0.3
    n_pairs: 1000
    prefix_k: 3     # Step 5: ARI(prefix_k=3)=0.721 >> ARI(prefix_k=2)=0.565 → k=3 explains v=0 islands
    phase_start_epoch: 50

  lagrangian:
    enabled: true
    lr: 0.1
    max_lambda: 5.0
    warmup_epochs: 10

  # Valuation prior: disabled in V7 — targeting ||mu|| is no longer meaningful
  # since radius is now controlled by linear_r(mu[:, :radial_dims]), not ||mu||.
  # RadialHierarchyLoss and MonotonicRadialLoss enforce correct radii directly.
  valuation_prior:
    enabled: false
    weight: 1.0
    scale: 3.0

# =============================================================================
# Training Configuration
# =============================================================================
training:
  epochs: 200
  batch_size: 2048  # Increased 512→2048: 5GB VRAM allows this; gives 36 same-class pairs/batch vs 9.6 for AngularCoherenceLoss
  lr: 8.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0

  scheduler:
    type: cosine_warmup_restart
    T_0: 25
    T_mult: 2

  eval_every: 2
  save_every: 25
  print_every: 2

# =============================================================================
# Data Configuration
# =============================================================================
data:
  use_full_dataset: true
  n_operations: 19683

# =============================================================================
# Logging
# =============================================================================
logging:
  tensorboard: true
  log_dir: runs/v7
  print_every: 2

  enhanced_metrics:
    enabled: true
    log_gradients: true
    log_weights: true
    log_activations: false
    gradient_flow_analysis: true
    effective_rank: true

# =============================================================================
# Checkpoints
# =============================================================================
checkpoints:
  save_dir: runs/checkpoints/v7
  save_best: true
  best_metric: composite_score
  checkpoint_name: v7

# =============================================================================
# Success Criteria
# =============================================================================
targets:
  coverage: 1.0
  hierarchy_B: -0.95   # V7 target: factored latent eliminates radial scatter
  richness: 0.008
  r_v9: 0.12
  distance_correlation: 0.94
  Q_target: 2.37

# =============================================================================
# Memory Optimization
# =============================================================================
memory:
  empty_cache_freq: 25
  cudnn_benchmark: true

# =============================================================================
# Version Tracking
# =============================================================================
version:
  model: "7.0"
  config: "v7_factored_latent"
  date: "2026-03-22"
  changes:
    - "Factored latent: z_r (k=4) → radius, z_θ (28) → direction"
    - "HyperbolicProjection factored mode: r=sigmoid(linear_r(z_r))*max_r, dir=normalize(z_θ)"
    - "Gradient isolation: d(||z_hyp||)/d(z_θ)=0 by F.normalize Jacobian orthogonality"
    - "No expmap0 in factored mode: z_hyp=r*dir is Poincaré ball point by construction"
    - "ValuationPriorLoss disabled: ||mu|| no longer proxies radius in factored mode"
    - "Expected Q → ~2.37 (breaking V6 ceiling of 2.163)"
