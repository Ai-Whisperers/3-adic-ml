# v19.2_option_b_test.yaml - Test config for dynamic curriculum, contrastive, and surrogate losses
device:
  cuda_device: 0
  use_amp: false

model:
  name: TernaryVAEV6Controllable
  latent_dim: 16
  hidden_dim: 64
  max_radius: 0.95
  curvature: 1.0
  learnable_curvature: true
  factored: false
  projection_layers: 2
  projection_dropout: 0.1
  init_identity: true
  tangent_scale: 0.1
  encoder_type: improved
  decoder_type: improved

option_c:
  enabled: true
  encoder_a_lr_scale: 0.5
  encoder_b_lr_scale: 0.2
  projections_lr_scale: 1.0

anchor_checkpoint: null

statenet:
  enabled: true
  initial:
    encoder_a_trainable: true
    encoder_b_trainable: true
    projections_trainable: true
  coverage:
    fix_threshold: 0.35
    train_threshold: 0.45
    floor: 0.3
  hierarchy:
    plateau_threshold: 0.0005
    plateau_patience: 10
  timing:
    warmup_epochs: 2
    hysteresis_epochs: 2

loss:
  dynamic_curriculum:
    enabled: true
    coverage_threshold: 0.65  # Lower threshold for quick testing activation
  hyperbolic_contrastive:
    enabled: true
    weight: 1.5
    temperature: 0.1
    prefix_k: 3
    phase_start_epoch: 0
  surrogate_property:
    enabled: true
    weight: 1.0
    hidden_dim: 128
    phase_start_epoch: 0

  rich_hierarchy:
    enabled: true
    hierarchy_weight: 5.0
    coverage_weight: 1.0
    separation_weight: 3.0
    variance_weight: 0.5
    inner_radius: 0.08
    outer_radius: 0.85
  radial:
    enabled: true
    weight: 1.5
    margin_weight: 0.5
  geodesic:
    enabled: true
    phase_start_epoch: 1
    curvature: 1.0
    max_target_distance: 3.0
    n_pairs: 1000
    use_smooth_l1: true
    weight: 2.0
  rank:
    enabled: true
    weight: 0.5
    temperature: 0.1
    n_pairs: 1000
  monotonic:
    enabled: true
    weight: 1.0
  hyperbolic_kl:
    enabled: true
    beta: 0.1
    weight: 0.01
    free_bits: 0.5
    variance_only: true
  lagrangian:
    enabled: true
    lr: 0.1
    max_lambda: 5.0
    warmup_epochs: 2
  valuation_prior:
    enabled: true
    weight: 1.0
    scale: 3.0

training:
  num_workers: 2
  epochs: 5
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  scheduler:
    type: cosine_warmup_restart
    T_0: 5
    T_mult: 1
  eval_every: 1
  save_every: 5
  print_every: 1

logging:
  enhanced_metrics:
    enabled: true
