# v6.yaml - P-Adic VAE V6.0 Configuration
# True Hyperbolic Architecture with Riemannian Optimization
#
# V6.0 Architecture Features:
# - True hyperbolic geometry via geoopt expmap0/logmap0
# - Decoder uses logmap0(z_hyp) instead of z_euc
# - ManifoldParameter for z_hyp (type safety + constraint enforcement)
# - RiemannianAdam with stabilize for learnable curvature
# - Geodesic interpolation for visualization/analysis
# - "Trainable" terminology (positive logic, not "frozen")
#
# Key Changes from V5.x:
# - Projection: direction*radius → expmap0 (true hyperbolic)
# - Decoder input: z_euc → logmap0(z_hyp)
# - Optimizer: Adam → RiemannianAdam with stabilize
# - Classes: TernaryVAEV5_11* → TernaryVAEV6*
#
# Reference:
#   Mathieu et al. (2019) "Continuous Hierarchical Representations with Poincaré VAEs"

# =============================================================================
# Device Configuration
# =============================================================================
device:
  cuda_device: 0
  use_amp: false  # Disable AMP for numerical stability near manifold boundary

# =============================================================================
# Model Architecture (V6.0 True Hyperbolic)
# =============================================================================
model:
  name: TernaryVAEV6Controllable
  latent_dim: 32
  hidden_dim: 64
  max_radius: 0.95  # Poincaré ball boundary constraint
  curvature: 1.0
  learnable_curvature: true  # Curvature is optimized via RiemannianAdam
  factored: false  # Legacy V6 architecture uses expmap0/logmap0, not the V7 radius/direction split

  # Projection network (tangent space transform before expmap0)
  projection_layers: 2
  projection_dropout: 0.1
  init_identity: true   # Identity init: tangent_net starts as zero residual (empirically better norms)
  tangent_scale: 0.1    # Initial tangent_scale value; learned during training
  # Note: decoder is decoupled from tangent_scale (receives z_tangent directly),
  # so tangent_scale is free to grow to reach target Poincaré radii.

  # Encoder/Decoder architecture
  encoder_type: improved  # SiLU + LayerNorm
  decoder_type: improved

# =============================================================================
# Riemannian Optimization (V6.0 Feature)
# =============================================================================
riemannian:
  enabled: true
  optimizer: adam  # RiemannianAdam from geoopt
  stabilize: 10    # Re-project manifold parameters every N steps
  # Note: stabilize ensures learnable curvature stays on positive reals manifold

# =============================================================================
# Geometry Settings (V6.0)
# =============================================================================
# NOTE: geometry.use_manifold_parameter and geometry.geodesic_steps were removed
# (dead config, no code reads them). Archived in archive-for-review/config_drift/
# =============================================================================
# Differential Learning Rates (Complementary Learning Systems)
# =============================================================================
option_c:
  enabled: true
  encoder_a_lr_scale: 0.2     # Coverage encoder: increased from 0.05 — coverage was 0.001 across all epochs
  encoder_b_lr_scale: 0.1     # Hierarchy encoder: slower learning
  projections_lr_scale: 1.0   # Projections/Controller: fastest (continuous adaptation)

# =============================================================================
# Anchor Checkpoint (Optional: Start from Pre-trained Weights)
# =============================================================================
# anchor_checkpoint:
#   path: "runs/v6_20260321_210840/checkpoints/best_Q.pt"  # Best: Q=2.163, hier=0.839 (ceiling confirmed)
#   encoder_to_load: both
#   decoder_to_load: decoder_A

# =============================================================================
# StateNet Controller (Dynamic Trainability)
# =============================================================================
statenet:
  enabled: true

  # Initial trainability states (before StateNet takes over)
  initial:
    encoder_a_trainable: true    # Start trainable (both encoders active)
    encoder_b_trainable: true     # Start trainable (hierarchy learner)
    projections_trainable: true   # Start trainable (fast adapter)

  # Coverage thresholds (encoder_a control)
  coverage:
    fix_threshold: 0.35          # Fix encoder when per-digit accuracy drops below 0.35 (near random)
    train_threshold: 0.45        # Allow training when per-digit accuracy above 0.45 (above random)
    floor: 0.3
  hierarchy:
    plateau_threshold: 0.0005
    plateau_patience: 10
    patience_ceiling: 25

  # Controller/Projections gradient monitoring
  controller:
    grad_threshold: 0.001   # was 0.005 — harder to trigger projection freeze
    grad_patience: 20        # was 5 — sustained low gradient required before freezing
    patience_ceiling: 40     # was 20

  # Timing configuration
  timing:
    warmup_epochs: 10
    hysteresis_epochs: 5

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  # PRIMARY: Rich Hierarchy Loss (unified hierarchy + coverage + separation)
  rich_hierarchy:
    enabled: true
    hierarchy_weight: 5.0
    coverage_weight: 1.0
    separation_weight: 3.0
    variance_weight: 0.5
    inner_radius: 0.08
    outer_radius: 0.85

  # Radial targets (MSE to target radii based on 3-adic valuation)
  radial:
    enabled: true
    # Note: inner_radius/outer_radius automatically shared from rich_hierarchy
    weight: 1.5   # Increased from 0.5: primary lever for within-level radial tightness
    margin_weight: 0.5
  # Geodesic loss (Poincaré distance alignment)
  geodesic:
    enabled: true
    phase_start_epoch: 10
    curvature: 1.0
    max_target_distance: 3.0
    n_pairs: 2000
    use_smooth_l1: true
    weight: 2.0
    use_individual_valuation: false  # Reverted: linear target compresses v=0 pairs; see roadmap Step 1 notes

  # Global rank loss (soft ordering violations + within-level scatter)
  rank:
    enabled: true
    weight: 0.5
    temperature: 0.1
    n_pairs: 2000
    scatter_weight: 0.8  # Increased from 0.3: tighten within-level radial clustering

  # Monotonic radial ordering
  monotonic:
    enabled: true
    # Note: inner_radius/outer_radius automatically shared from rich_hierarchy
    weight: 1.0
    target_loss_weight: 0.5
    min_margin: 0.02
  # Hyperbolic KL divergence (curvature-corrected, optional)
  # Uses conformal factor λ(x) for proper Poincaré geometry
  hyperbolic_kl:
    enabled: true         # Required: makes this a true VAE (not a deterministic AE)
    beta: 0.1             # Conservative: prevents KL dominating hierarchy losses
    weight: 0.01          # Low weight: hierarchy structure takes priority
    free_bits: 0.5        # Minimum KL per dim: prevents posterior collapse
    variance_only: true   # Disable μ² term: ValuationPriorLoss handles mean target

  # Within-level contrastive loss: pull same-valuation points geodesically together.
  # Addresses the 0.839 hierarchy ceiling — all other losses are radial (push to target
  # radius) but none minimises angular/geodesic spread within a level.
  within_level_contrastive:
    enabled: false        # Disabled: WLC tightened within-level std 3× but hierarchy stayed 0.839
    weight: 0.5           # (irreducible reconstruction diversity is the true ceiling)
    max_pairs_per_level: 500

  # Lagrangian dual adaptive weighting (Phase 3B)
  # Dual variables increase pressure on violated per-level constraints (margin,
  # within-level scatter, μ-norm prior). NOT gradient-descent parameters —
  # updated by dual ascent after each validation epoch.
  lagrangian:
    enabled: true
    lr: 0.1           # Dual ascent step size (increased from 0.01 — lambdas only reached 0.24 in 190 epochs, need 1-3 range)
    max_lambda: 5.0   # Cap on any single dual variable (prevents runaway)
    warmup_epochs: 10 # Freeze duals until epoch 10 (reduced from 20 — scatter duals need to fire sooner)

  # Valuation-conditioned prior (Phase 1: corrects wrong-direction KL gradient)
  # Replaces N(0,I) mean pull with pull toward target_tangent[v₃(i)] per sample.
  # target_tangent[v] = arctanh(r_euclid[v]) / sqrt(c)
  # v=0 target ≈ 1.256, v=9 target ≈ 0.08 — matches exponential radial hierarchy.
  valuation_prior:
    enabled: true
    weight: 1.0   # MSE((||μ||, target)) — same scale as hierarchy losses
    scale: 3.0    # Exponential decay rate (matches _exponential_target_radii)

# =============================================================================
# Training Configuration
# =============================================================================
training:
  num_workers: 4
  epochs: 200
  batch_size: 512
  lr: 8.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0

  # NOTE: training.use_stratified, high_v_budget_ratio, use_adaptive,
  # hierarchy_threshold, patience, min_epochs were removed (dead config,
  # no code reads them). Archived in archive-for-review/config_drift/

  # Learning rate scheduler
  scheduler:
    type: cosine_warmup_restart
    T_0: 25
    T_mult: 2

  # Evaluation frequency
  eval_every: 2
  save_every: 25
  print_every: 2

# =============================================================================
# Logging
# =============================================================================
logging:

  enhanced_metrics:
    enabled: true
    log_gradients: true
    log_weights: true
    log_activations: false  # Disabled for memory
    gradient_flow_analysis: true
    effective_rank: true

# =============================================================================
# Checkpoints
# =============================================================================
# =============================================================================
# Memory Optimization
# =============================================================================
memory:
  empty_cache_freq: 25
  cudnn_benchmark: true
  # NOTE: gradient_checkpointing and max_memory_growth were removed (dead config,
  # no code reads them). Archived in archive-for-review/config_drift/

# NOTE: early_stopping section was removed entirely (dead config,
# GrokkingDetector has its own internal logic).
# Archived in archive-for-review/config_drift/
