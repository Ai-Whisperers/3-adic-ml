# v7_large.yaml - P-Adic VAE V7.2 Configuration
# Large architecture experiment: latent_dim 32→64 (direction dims 28→60)
#
# Hypothesis: ARI ceiling at 0.82 is caused by 28 direction dims being too tight
# for 27 prefix classes. 60 direction dims gives 2x more angular capacity.
#
# Changes from v7.yaml (V7.1 aggressive):
#   - latent_dim: 32 → 64  (direction_dims: 28 → 60)
#   - hidden_dim: 64 → 128  (wider encoder/decoder backbone)
#   - epochs: 1500 → 800   (shorter since architecture is fresh)
#   - log/checkpoint dirs updated to v7_large
#   - All AC settings kept: weight=1.0, phase_start=10, n_pairs=2000
#
# Expected: ARI > 0.90 if dimensionality was the bottleneck
# VRAM estimate: ~300MB (well within 6GB)

# =============================================================================
# Device Configuration
# =============================================================================
device:
  name: "v7_factored"
  cuda_device: 0
  use_amp: false
  pin_memory: true
  num_workers: 4
  empty_cache_freq: 25

# =============================================================================
# Model Architecture (V7.0 Factored Latent)
# =============================================================================
model:
  name: TernaryVAEV6Controllable
  latent_dim: 64   # 32→64: direction_dims = 60 (was 28) — 2x more angular capacity
  hidden_dim: 128  # 64→128: wider backbone for richer representations
  max_radius: 0.99   # was 0.95 — gives v=0 cluster room past Lagrangian margin ceiling
  curvature: 1.0
  learnable_curvature: true  # No-op in factored mode: expmap0 is never called → manifold.c gets no grads

  # V7 factored latent: split z_tangent into z_r (radial) and z_θ (direction)
  factored: true
  radial_dims: 4          # k=4: enough for 10 valuation levels, small enough to not dominate

  # Projection network (operates on z_θ only in factored mode)
  projection_layers: 2
  projection_dropout: 0.1
  init_identity: true
  tangent_scale: 0.1

  encoder_type: improved
  decoder_type: improved

# =============================================================================
# Riemannian Optimization
# =============================================================================
riemannian:
  enabled: true
  optimizer: adam
  stabilize: 10

# =============================================================================
# Precision Settings
# =============================================================================
precision:
  dtype: float64

# =============================================================================
# Differential Learning Rates
# =============================================================================
option_c:
  enabled: true
  encoder_a_lr_scale: 0.2
  encoder_b_lr_scale: 0.1
  projections_lr_scale: 1.0

# =============================================================================
# Anchor Checkpoint — train from scratch (V6 projection weights incompatible)
# Encoder weights could be loaded but projection dims changed (32→28 direction).
# =============================================================================
# anchor_checkpoint:
#   path: "runs/v6_20260321_210840/checkpoints/best_Q.pt"
#   encoder_to_load: both
#   decoder_to_load: decoder_A

# =============================================================================
# StateNet Controller
# =============================================================================
statenet:
  enabled: true

  initial:
    encoder_a_trainable: true
    encoder_b_trainable: true
    projections_trainable: true

  coverage:
    fix_threshold: 0.35
    train_threshold: 0.45
    floor: 0.3
  hierarchy:
    plateau_threshold: 0.0005
    plateau_patience: 10
    patience_ceiling: 25

  controller:
    grad_threshold: 0.001
    grad_patience: 20
    patience_ceiling: 40

  timing:
    warmup_epochs: 10
    hysteresis_epochs: 5

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  rich_hierarchy:
    enabled: true
    hierarchy_weight: 5.0
    coverage_weight: 1.0
    separation_weight: 5.0  # was 3.0 — harder push on v=0/v=1 gap to satisfy Lagrangian margin_v0
    variance_weight: 2.0  # Root Cause B fix: was 0.5 — compresses within-level radial spread (std≈0.05 → Spearman 0.84)
    inner_radius: 0.08
    outer_radius: 0.85

  radial:
    enabled: true
    weight: 1.5
    margin_weight: 0.5

  geodesic:
    enabled: true
    phase_start_epoch: 10
    curvature: 1.0
    max_target_distance: 3.0
    n_pairs: 2000
    use_smooth_l1: true
    weight: 2.0
    use_individual_valuation: true   # Root Cause A fix: target=|val_i-val_j|/max_val instead of v_3(|i-j|)

  rank:
    enabled: true
    weight: 0.5
    temperature: 0.1
    n_pairs: 2000
    scatter_weight: 0.3  # V7: scatter near-zero by construction (was 0.8, reduced per Item F diagnostic)

  monotonic:
    enabled: true
    weight: 1.0
    target_loss_weight: 0.5
    min_margin: 0.02

  hyperbolic_kl:
    enabled: true
    beta: 0.1
    weight: 0.01
    free_bits: 0.5
    variance_only: false  # V7: ValuationPriorLoss is disabled, so re-enable ||mu||² term
                          # to prevent mu[:, 4:] (z_θ) drifting unboundedly.
                          # KL weight=0.01 vs hierarchy weight=5.0 → hierarchy wins.

  within_level_contrastive:
    enabled: false
    weight: 0.5
    max_pairs_per_level: 500

  angular_coherence:
    enabled: true
    weight: 1.0      # 0.3→1.0: direction geometry already stable, push harder
    n_pairs: 5000    # 3000→5000: ~830 per active level for 6 levels (v=0-5)
    prefix_k: 3      # global fallback (used only when level_prefix_k is null)
    phase_start_epoch: 10  # 50→10: reconstruction converges in <10 epochs
    # Per-level prefix depth: v=0→k=3 (27 classes), v=1→k=4, v=2→k=5, v=3+→skip (0)
    # Root cause of ARI=0.85 ceiling: v=1/v=2 had only 2/1 class at k=3.
    # Deeper k gives 81/243 prefix classes at v=1/v=2 → finer-grained direction targets.
    level_prefix_k: [3, 4, 3, 4, 5, 6, 0, 0, 0, 0]
    # Soft-margin target per level: stop applying force once cos_sim >= target.
    # v=0: target=1.0 → equivalent to original hard pull (1 - cos_sim). Was 0.90 but that
    #   killed the AC signal (within-sim=0.981 > 0.90 → loss=0, ARI regressed 0.844→0.716).
    # v=1: target=0.85 → moderate pull (within-sim was 0.857 baseline)
    # v=2: target=0.70 → permissive (within-sim was 0.705 baseline)
    target_sim: [1.0, 0.93, 0.70, 0.70, 0.70, 0.70, 0.0, 0.0, 0.0, 0.0]

  lagrangian:
    enabled: true
    lr: 0.1
    max_lambda: 5.0
    warmup_epochs: 10

  # Valuation prior: disabled in V7 — targeting ||mu|| is no longer meaningful
  # since radius is now controlled by linear_r(mu[:, :radial_dims]), not ||mu||.
  # RadialHierarchyLoss and MonotonicRadialLoss enforce correct radii directly.
  valuation_prior:
    enabled: false
    weight: 1.0
    scale: 3.0

# =============================================================================
# Training Configuration
# =============================================================================
training:
  epochs: 1500    # 800→1500: more cosine LR cycles to stabilize v=1/v=5
  batch_size: 4096
  lr: 8.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0

  scheduler:
    type: cosine_warmup_restart
    T_0: 50          # 50+100+200+400=750 → ~4 cycles over 800 epochs
    T_mult: 2

  eval_every: 5
  save_every: 100
  print_every: 5

# =============================================================================
# Data Configuration
# =============================================================================
data:
  use_full_dataset: true
  n_operations: 19683

# =============================================================================
# Logging
# =============================================================================
logging:
  tensorboard: true
  log_dir: runs/v7_large
  print_every: 5

  enhanced_metrics:
    enabled: true
    log_gradients: true
    log_weights: true
    log_activations: false
    gradient_flow_analysis: true
    effective_rank: true

# =============================================================================
# Checkpoints
# =============================================================================
checkpoints:
  save_dir: runs/checkpoints/v7_large
  save_best: true
  best_metric: composite_score
  checkpoint_name: v7_large

# =============================================================================
# Success Criteria
# =============================================================================
targets:
  coverage: 1.0
  hierarchy_B: -0.95   # V7 target: factored latent eliminates radial scatter
  richness: 0.008
  r_v9: 0.12
  distance_correlation: 0.94
  Q_target: 2.37

# =============================================================================
# Memory Optimization
# =============================================================================
memory:
  empty_cache_freq: 25
  cudnn_benchmark: true

# =============================================================================
# Phase 2 Visualization Pipeline
# =============================================================================
visualization:
  max_per_level: 500        # Points per valuation level in stratified subsample (~4501 total)
  persist_every: 50         # Epochs between persistent homology computation
  html_dir: runs/visualizations/v7_large   # Interactive HTML output directory
  save_html: true
  umap_neighbors: 15        # UMAP n_neighbors (default); also used for PaCMAP kNN
  curvature: 1.0            # Must match model.curvature

# =============================================================================
# Version Tracking
# =============================================================================
version:
  model: "7.2"
  config: "v7_large_architecture"
  date: "2026-03-23"
  changes:
    - "Factored latent: z_r (k=4) → radius, z_θ (28) → direction"
    - "HyperbolicProjection factored mode: r=sigmoid(linear_r(z_r))*max_r, dir=normalize(z_θ)"
    - "Gradient isolation: d(||z_hyp||)/d(z_θ)=0 by F.normalize Jacobian orthogonality"
    - "No expmap0 in factored mode: z_hyp=r*dir is Poincaré ball point by construction"
    - "ValuationPriorLoss disabled: ||mu|| no longer proxies radius in factored mode"
    - "Expected Q → ~2.37 (breaking V6 ceiling of 2.163)"
