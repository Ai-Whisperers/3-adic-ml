anchor_checkpoint:
  path: runs/v19.0_hybrid_curriculum_20260526_115529/checkpoints/best_Q.pt
data:
  indices_path: data/rosetta_indices.pt
  valuation_type: index
device:
  cuda_device: 0
  use_amp: true
logging:
  enhanced_metrics:
    effective_rank: true
    enabled: true
    gradient_flow_analysis: true
    log_activations: true
    log_gradients: true
    log_weights: true
  histogram_every: 50
  verbose: false
loss:
  # --- Resuming with all losses active ---
  algebraic_addition:
    enabled: true
    n_pairs: 2048
    phase_start_epoch: 0
    weight: 20.0
  algebraic_coherence:
    enabled: true
    min_class_size: 5
    n_pairs: 4000
    phase_start_epoch: 0
    target_sim: 0.85
    weight: 10.0
  algebraic_multiplication:
    enabled: true
    n_pairs: 2048
    phase_start_epoch: 0
    weight: 20.0
  angular_coherence:
    enabled: true
    level_prefix_k: [5, 4, 3, 2, 2, 1, 0, 0, 0, 0]
    n_pairs: 4000
    phase_start_epoch: 0
    prefix_k: 2
    target_sim: [1.0, 0.95, 0.9, 0.85, 0.8, 0.7, 0.0, 0.0, 0.0, 0.0]
    weight: 5.0
  
  rich_hierarchy:
    enabled: true
    coverage_weight: 10.0
    hierarchy_weight: 10.0
    inner_radius: 0.05
    outer_radius: 0.9
    separation_margin: 0.1
    separation_weight: 10.0
    variance_weight: 5.0
  
  radial:
    enabled: true
    inner_radius: 0.05
    margin_step_factor: 0.01
    margin_weight: 2.0
    outer_radius: 0.95
    valuation_weight_exponent: 0.3
    weight: 5.0
    phase_start_epoch: 0
    
  geodesic:
    curvature: 1.0
    enabled: true
    max_target_distance: 4.0
    n_pairs: 4000
    phase_start_epoch: 0
    use_individual_valuation: true
    use_smooth_l1: true
    valuation_scale: 4.0
    weight: 10.0
    
  rank:
    enabled: true
    n_pairs: 4000
    scatter_weight: 1.0
    temperature: 0.1
    use_all_pairs: false
    weight: 2.0
    phase_start_epoch: 0
    
  monotonic:
    enabled: true
    inner_radius: 0.05
    margin_scale: 1.0
    min_margin: 0.02
    outer_radius: 0.95
    target_loss_weight: 0.5
    temperature: 0.05
    use_soft_margin: true
    weight: 2.0
    phase_start_epoch: 0

  # Basics
  hyperbolic_kl:
    beta: 0.1
    enabled: true
    free_bits: 0.5
    variance_only: false
    weight: 0.05
  lagrangian:
    enabled: true
    lr: 0.05
    max_lambda: 10.0
    n_levels: 10
    warmup_epochs: 10
  learnable_weights: true
model:
  curvature: 1.0
  decoder_type: improved
  detach_radial: false
  encoder_type: improved
  factored: true
  hidden_dim: 256
  init_identity: true
  latent_dim: 128
  learnable_curvature: true
  max_radius: 0.99
  name: TernaryVAEV6Controllable
  positional_encoding: true
  projection_dropout: 0.1
  projection_layers: 3
  radial_dims: 16
  tangent_scale: 0.1
option_c:
  enabled: true
  encoder_a_lr_scale: 0.2
  encoder_b_lr_scale: 0.1
  projections_lr_scale: 1.0
resume_checkpoint: null
riemannian:
  enabled: true
  optimizer: adam
  stabilize: 10
statenet:
  controller:
    grad_patience: 10
    grad_threshold: 0.002
    patience_ceiling: 50
    spike_multiplier: 2.0
  coverage:
    fix_threshold: 0.4
    floor: 0.35
    train_threshold: 0.5
  enabled: true
  hierarchy:
    patience_ceiling: 50
    plateau_patience: 30
    plateau_threshold: 0.0002
    stall_patience: 10
  initial:
    encoder_a_trainable: true
    encoder_b_trainable: true
    projections_trainable: true
  lr_scales:
    decoders: 1.0
    encoder_a: 0.05
    encoder_b: 0.1
    projections: 1.0
  timing:
    hysteresis_epochs: 5
    warmup_epochs: 10
    window_size: 5
training:
  batch_size: 4096
  epochs: 100
  eval_every: 10
  grokking_detection:
    accuracy_jump_threshold: 0.02
    enabled: true
    gradient_norm_track: true
    monitor_window: 10
    plateau_patience: 10
    plateau_threshold: 0.0001
    representation_analysis: true
  hierarchy_threshold: -0.85
  high_v_budget_ratio: 0.3
  lr: 0.0001 # Reduced learning rate for fine-tuning
  max_grad_norm: 1.0
  min_epochs: 20
  num_workers: 4
  patience: 50
  print_every: 10
  save_every: 50
  scheduler:
    T_0: 100
    T_mult: 1
    type: cosine_warmup_restart
  use_adaptive: true
  use_stratified: true
  val_frac: 0.05
  weight_decay: 0.0001
version:
  changes:
  - 'V19.1: Peptide Fine-tuning run from pre-trained v19.0'
  config: v19.1_peptide_retrain
  date: '2026-05-31'
  model: '19.1'
visualization:
  curvature: 1.0
  html_dir: visualizations
  max_per_level: 1000
  persist_every: 100
  save_html: false
  umap_neighbors: 30
